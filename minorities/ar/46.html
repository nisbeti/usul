<p>فقه الأقليات لن ينجح في مهمته الدينية والاجتماعية إلا إذا استند بقوة إلى القطعيات، وقدم رؤية فقهية سليمة تجمع بين الأصالة الشرعية والواقعية العملية المنضبطة، دون أن تكون المصلحة العقلية المحضة هي النسخة التي تنسخ الأحكام الثابتة.</p>
