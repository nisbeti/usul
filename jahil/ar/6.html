<p>الاعتقادات أو الأعمال و قصرها بعضهم على الاعتقادات  فهو معاقب عليه لا عذر فيه وقصر بعضهم هذا على جانب التوحيد وما يتعلق به أما جانب الأعمال فهذه لا تجب عندهم بالعقل  بل بالسمع فقط عن طريق الوحي و مرتكبها معذور في ذلك حتى يتمكن من بلوغ الدليل الشرعي أو يبلغه الدليل الشرعي فعلا</p>
