<article class="page" data-page="28">
<p>وملخص القول في هذه الأدلة المختلف فيها بين المجتهدين والأصوليين، أن الاختلاف فيها يُشْعِرُ أنها ليست قطعية. وكونها ليست قطعية كافٍ لرده وعدم اعتبارها. إذ الأصول يجب أن تكون يقينية.</p>
