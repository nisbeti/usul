<p>وقد رده بعد بحث مفصل الإمام تقي الدين النبهاني رحمه الله(176).</p>
<p>وكذلك رده الدكتور محمد حسين عبد الله(177)، وعطا أبو الرشتة(178).</p>
<p>__________</p>
<p>(176) الشخصية الإسلامية، ج3.</p>
<p>(177) الواضح في أصول الفقه.</p>
<p>(178) تيسير الوصول إلى علم الأصول.</p>
