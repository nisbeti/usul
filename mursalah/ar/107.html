<article class="page" data-page="107">
<p>الزيادة على حد الضرورة من الحرام إذا طَبَقَ الحرام الأرض.</p>
<p>قتل الجماعة بالواحد.</p>
<p>إقامة الإمام الأمثل ممن ليس بمجتهد إذا خلا الزمان عن مجتهد.</p>
<p>بيعة المفضول مع وجود الأفضل.</p>
<p>وفي هذا الذي أوردناه عن الشاطبي رحمه الله كفاية لبيان أنه لم يجعل المصلحة باباً من أبواب التشريع.</p>
</article>
