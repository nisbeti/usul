<p>النهي، وفعل النبي صلى الله عليه وسلم وسكوته، وكيفية حال المستدل أي معرفة الاجتهاد ما هو، والمجتهد من هو، ويشمل كيفية الاستدلال أي التعادل والتراجيح(2).</p>
<p>__________</p>
<p>(2) انظر: الإحكام للآمدي ص 5 - 8.</p>
